[project]
name = "foolbookeditor"
version = "0.3.3"
description = "Editor for Foolbook books. Foolbook is the core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "foolbook @ git+https://github.com/squirelworks/Foolbook.git",
]

[project.urls]
Repository = "https://github.com/squirelworks/FoolbookEditor"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["foolbookeditor*", "author*"]
