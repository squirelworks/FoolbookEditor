[project]
name = "foolbookeditor"
version = "0.4.0"
description = "Editor for Foolbook books. Foolbook is the core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "foolbook @ git+https://github.com/squirelworks/Foolbook.git@031e8d81c4ae258f90161df4e0c52189c3f102b6",
]

[project.urls]
Repository = "https://github.com/squirelworks/FoolbookEditor"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["foolbookeditor*", "author*"]

[tool.setuptools.package-data]
foolbookeditor = ["demo/*.fbk"]
